version: '3.8'

services:
  # 1. PostgreSQL Database — Single Source of Truth
  db:
    image: postgres:16-alpine
    container_name: jansahaya-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jansahaya}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jansahaya}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python (FastAPI) Backend & Specialized AI/NLP Services
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jansahaya-fastapi
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-jansahaya}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app/backend
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Frontend & Core Application
  frontend:
    image: node:20-alpine
    container_name: jansahaya-react
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-jansahaya}?schema=public
      FASTAPI_BACKEND_URL: http://backend:8000
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    command: sh -c "npx prisma generate && npm run dev"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
